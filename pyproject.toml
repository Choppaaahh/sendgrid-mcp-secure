[project]
name = "sendgrid-mcp-secure"
version = "0.1.0"
description = "Security-first MCP server for the SendGrid v3 API: two-phase sends, dry-run by default, recipient allowlists, rate limits, audit log, no BCC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.0.0"]

[project.scripts]
sendgrid-mcp-secure = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
