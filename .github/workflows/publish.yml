# PyPI trusted publishing — no tokens anywhere. Triggered by version tags (v0.1.0 etc).
# One-time setup on PyPI: Account -> Publishing -> add pending publisher
# (project: sendgrid-mcp-secure, owner: Choppaaahh, repo: sendgrid-mcp-secure, workflow: publish.yml)
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
