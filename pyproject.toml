[project]
name = "sendgrid-mcp-secure"
version = "0.1.1"
description = "Security-first MCP server for the SendGrid v3 API: two-phase sends, dry-run by default, recipient allowlists, rate limits, audit log, no BCC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<2"]  # 2.0.0 removed mcp.server.fastmcp (breaking); FastMCP lives in 1.x

[project.scripts]
sendgrid-mcp-secure = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "trust.json"]

# trust.json ships inside the wheel so an agent evaluating the INSTALLED
# package — not just the repo — can find the claims and their verify commands.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"trust.json" = "trust.json"
